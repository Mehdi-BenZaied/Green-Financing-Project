name: CI/CD Angular + FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Keep your existing jobs exactly as they are
  frontend:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint Angular
        run: npm run lint
        continue-on-error: true
        
      - name: Test Angular
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true
        
      - name: Build Angular
        run: npm run build -- --configuration=production

  backend:
    name: FastAPI Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest fastapi uvicorn
          
      - name: Lint Python
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
        
      - name: Test FastAPI
        run: |
          cd backend
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v
          else
            echo "No tests found, skipping test step"
          fi
        continue-on-error: true

  # NEW: Add Docker testing
  docker-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Test Docker Compose Build
        run: |
          echo "🐳 Testing Docker Compose build..."
          
          # Create a test environment file
          mkdir -p backend
          touch backend/.env
          echo "DATABASE_URL=mysql://root:test123@db:3306/test_db" >> backend/.env
          echo "JWT_SECRET=test-secret-key" >> backend/.env
          
          # Build all services
          docker-compose build
          
          echo "✅ Docker Compose build successful!"
          
      - name: Test Container Health
        run: |
          echo "🔍 Testing container health..."
          
          # Start services in detached mode
          docker-compose up -d
          
          # Wait for services to start
          sleep 45
          
          # Check if containers are running
          docker-compose ps
          
          # Test backend health (if you have a health endpoint)
          if docker-compose exec -T backend curl -f http://localhost:8000/health 2>/dev/null; then
            echo "✅ Backend health check passed"
          else
            echo "⚠️ Backend health check failed (endpoint might not exist yet)"
          fi
          
          # Test if frontend is accessible
          if docker-compose exec -T frontend curl -f http://localhost:80/ 2>/dev/null; then
            echo "✅ Frontend accessibility check passed"
          else
            echo "⚠️ Frontend check failed (might be normal for SPA)"
          fi
          
          # Show logs for debugging
          echo "📋 Container logs:"
          docker-compose logs --tail=50
          
        continue-on-error: true
        
      - name: Cleanup Docker
        if: always()
        run: |
          docker-compose down -v
          docker system prune -f

 

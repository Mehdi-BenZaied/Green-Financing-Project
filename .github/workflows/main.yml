name: CI/CD Angular + FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Keep your existing jobs exactly as they are
  frontend:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint Angular
        run: npm run lint
        continue-on-error: true
        
      - name: Test Angular
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true
        
      - name: Build Angular
        run: npm run build -- --configuration=production

  backend:
    name: FastAPI Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest fastapi uvicorn
          
      - name: Lint Python
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
        
      - name: Test FastAPI
        run: |
          cd backend
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v
          else
            echo "No tests found, skipping test step"
          fi
        continue-on-error: true

  # NEW: Add Docker testing
  docker-test:
    name: Docker Build & Test with Secrets
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Free up disk space
        run: |
          echo "🧹 Freeing up disk space on GitHub Actions runner..."
          echo "📊 Initial disk usage:"
          df -h
          
          # Remove unnecessary packages and files
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo apt-get autoclean
          
          # Remove large packages we don't need
          sudo apt-get remove -y \
            '^dotnet-.*' \
            '^llvm-.*' \
            'php.*' \
            '^mongodb-.*' \
            '^mysql-.*' \
            azure-cli \
            google-cloud-sdk \
            hhvm \
            google-chrome-stable \
            firefox \
            powershell \
            mono-devel || true
            
          # Remove Docker images we don't need
          docker system prune -af
          docker volume prune -f
          
          # Remove snap packages
          sudo snap list --all | awk '/disabled/{print $1, $3}' | while read snapname revision; do
            sudo snap remove "$snapname" --revision="$revision" || true
          done
          
          # Clean up more space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          
          echo "📊 Disk usage after cleanup:"
          df -h
          echo "✅ Cleanup completed!"
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host
        
      - name: Create secure environment file
        run: |
          echo "🔒 Creating secure environment for Green-Financing-Project at $(date -u)"
          
          # Create backend/.env with GitHub Secrets
          mkdir -p backend
          cat > backend/.env << EOF
          DATABASE_URL=mysql://root:${{ secrets.MYSQL_ROOT_PASSWORD || 'Stage123@' }}@db:3306/${{ secrets.DATABASE_NAME || 'stage' }}
          ENVIRONMENT=test
          DEBUG=true
          CORS_ORIGINS=["http://localhost:4200", "http://localhost:80"]
          EOF
          
          echo "✅ Environment file created"
          
  
          
      - name: Start services efficiently
        run: |
          echo "🚀 Starting services..."
          
          # Clean up any existing containers first
          docker compose down -v --remove-orphans || true
          
          # Start services
          docker compose up -d
          
          echo "⏳ Waiting for services (30 seconds)..."
          sleep 30
          
          echo "📊 Service status:"
          docker compose ps
          
      - name: Quick health checks
        run: |
          echo "🏥 Running quick health checks..."
          
          # Quick database check
          if docker compose exec -T db mysqladmin ping -h localhost -u root -p${{ secrets.MYSQL_ROOT_PASSWORD || 'Stage123@' }} --silent; then
            echo "✅ Database is responding"
          else
            echo "⚠️ Database not responding yet"
          fi
          
          # Quick backend check
          if docker compose exec -T backend curl -f http://localhost:8000/ 2>/dev/null || docker compose exec -T backend curl -f http://localhost:8000/docs 2>/dev/null; then
            echo "✅ Backend is accessible"
          else
            echo "⚠️ Backend not accessible yet"
          fi
          
        continue-on-error: true
        
      - name: Show essential logs only
        if: failure()
        run: |
          echo "📋 Essential logs for debugging:"
          docker compose logs backend --tail=10 || true
          docker compose logs db --tail=5 || true
          
      - name: Aggressive cleanup
        if: always()
        run: |
          echo "🧹 Aggressive cleanup to free space..."
          docker compose down -v --remove-orphans || true
          docker system prune -af || true
          docker volume prune -f || true
          echo "✅ Cleanup completed"

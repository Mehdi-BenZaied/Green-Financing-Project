name: CI/CD Angular + FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Keep your existing jobs exactly as they are
  frontend:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint Angular
        run: npm run lint
        continue-on-error: true
        
      - name: Test Angular
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true
        
      - name: Build Angular
        run: npm run build -- --configuration=production

  backend:
    name: FastAPI Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest fastapi uvicorn
          
      - name: Lint Python
        run: |
          cd backend
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
        
      - name: Test FastAPI
        run: |
          cd backend
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v
          else
            echo "No tests found, skipping test step"
          fi
        continue-on-error: true

  # NEW: Add Docker testing
  docker-test:
    name: Docker Build & Test
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Test Docker Compose Build
        run: |
          echo "🐳 Testing Docker Compose build..."
          
          # Create backend .env file that matches your docker-compose.yml
          mkdir -p backend
          cat > backend/.env << EOF
          DATABASE_URL=mysql://root:Stage123@@db:3306/stage
          ENVIRONMENT=test
          DEBUG=true
          EOF
          
          echo "✅ Environment file created with correct credentials"
          
          # Build with Docker Compose V2 syntax
          docker compose build
          
          echo "✅ Docker Compose build successful!"
          
     

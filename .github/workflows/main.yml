name: CI/CD Angular + FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Angular Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # Fix: Remove the cache-dependency-path since your package.json is in root
          # cache-dependency-path: angular/package-lock.json  <- This was wrong
          
      - name: Install dependencies
        run: npm ci
        
      - name: Lint Angular
        run: npm run lint
        continue-on-error: true
        
      - name: Test Angular
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        continue-on-error: true
        
      - name: Build Angular
        run: npm run build -- --configuration=production

  backend:
    name: FastAPI Test & Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
          
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest fastapi uvicorn
          
      - name: Lint Python
        working-directory: backend
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true
        
      - name: Test FastAPI
        working-directory: backend
        run: |
          if [ -d "tests" ] || find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
            pytest -v
          else
            echo "No tests found, skipping test step"
          fi
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Deploy notification
        run: echo "🚀 Ready for deployment!"
